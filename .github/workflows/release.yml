# CD (ADR-0009): a version tag re-runs CI, publishes images to GHCR, and creates a GitHub
# Release with a compose file that runs exactly those images. No long-lived secrets (GOV-009).
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the GitHub Release
      packages: write # push to GHCR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image names
        id: names
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "backend=ghcr.io/${owner}/test-anova-backend:${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "frontend=ghcr.io/${owner}/test-anova-frontend:${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          push: true
          tags: ${{ steps.names.outputs.backend }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend
          push: true
          tags: ${{ steps.names.outputs.frontend }}
      - name: Release with a compose file pinned to these images
        env:
          GH_TOKEN: ${{ github.token }}
          BACKEND: ${{ steps.names.outputs.backend }}
          FRONTEND: ${{ steps.names.outputs.frontend }}
        run: |
          sed -e '/^[[:space:]]*build: \.\/\(backend\|frontend\)$/d' \
              -e "s|telemetry-backend:local|${BACKEND}|" \
              -e "s|telemetry-frontend:local|${FRONTEND}|" \
              compose.yaml > compose.release.yaml
          gh release create "$GITHUB_REF_NAME" compose.release.yaml --generate-notes --verify-tag
